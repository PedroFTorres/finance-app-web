<body><main><strong>AROLIX</strong><h1>Vamos reconectar?</h1><p>Conecte seu iPhone ou computador à internet para consultar os dados atualizados. Por segurança, suas informações financeiras não estão disponíveis offline.</p><button type="button" onclick="location.reload()">Tentar novamente</button></main></body>
