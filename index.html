<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Arolix</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <meta name="theme-color" content="#7552cf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Arolix">
  <link rel="manifest" href="site.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/pwa/apple-touch-icon.png">
  <link rel="stylesheet" href="mobile.css?v=20261018-1">
  <script src="pwa.js?v=20261018-1" defer></script>
</head>
<body class="entry-page">
  <main class="entry-shell" aria-live="polite">
    <img src="logo-arolix.png" class="entry-logo" alt="Arolix">
    <section class="entry-card">
      <span class="entry-badge">Arolix</span>
      <h1>Preparando seu painel financeiro</h1>
      <p>Estamos abrindo o ambiente correto para você acessar suas contas, lançamentos, cartões e investimentos.</p>
      <a class="btn-primary entry-action" href="login.html">Continuar</a>
    </section>
  </main>

  <script src="vendor/supabase-2.108.2.js"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const { data } = await supabase.auth.getSession();
        window.location.replace(data?.session ? "app.html" : "login.html");
      } catch (error) {
        window.location.replace("login.html");
      }
    });
  </script>
</body>
</html>
