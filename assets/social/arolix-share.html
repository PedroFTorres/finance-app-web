<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Arolix — arte de compartilhamento</title>
  <style>
    * { box-sizing:border-box; }
    html,body { width:1200px; height:630px; margin:0; overflow:hidden; }
    body { position:relative; background:#f8f7fb; color:#292735; font-family:Arial,Helvetica,sans-serif; }
    body::before { content:''; position:absolute; width:580px; height:580px; border:1px solid #e9e2f3; border-radius:50%; left:-340px; top:80px; box-shadow:0 0 0 60px #f1edf7,0 0 0 120px #f6f3fa; }
    body::after { content:''; position:absolute; width:500px; height:500px; border:1px solid #e6def0; border-radius:50%; right:-320px; top:-210px; box-shadow:0 0 0 55px #f1edf7,0 0 0 110px #f6f3fa; }
    main { position:relative; z-index:1; height:100%; display:flex; flex-direction:column; align-items:center; text-align:center; border-top:8px solid #7552cf; padding-top:62px; }
    img { width:344px; height:auto; display:block; }
    .eyebrow { color:#81728f; font-size:13px; font-weight:600; letter-spacing:3px; margin:27px 0 22px; }
    h1 { margin:0; font-size:62px; font-weight:700; line-height:1.12; letter-spacing:-2.5px; }
    h1 span { display:block; color:#7552cf; }
    .features { margin:27px 0 0; color:#706a7e; font-size:22px; letter-spacing:.2px; }
    .url { margin-top:32px; padding-top:19px; border-top:1px solid #ded6e9; width:280px; color:#7552cf; font-size:19px; font-weight:600; }
  </style>
</head>
<body><main><img src="../../logo-arolix.png" alt="Arolix"><p class="eyebrow">SEU ESPAÇO FINANCEIRO</p><h1>Seu dinheiro.<span>Tudo mais claro.</span></h1><p class="features">Contas · Cartões · Balanço</p><p class="url">arolix.com.br</p></main></body>
</html>
